name: HIFIVE 자동 실습일지

on:
  schedule:
    # 매일 오후 6시 (KST) = UTC 09:00
    - cron: '0 9 * * *'
  workflow_dispatch:  # 수동 실행 지원

jobs:
  write-diary:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실습일지 자동 작성
        env:
          HIFIVE_USER_ID: ${{ secrets.HIFIVE_USER_ID }}
          HIFIVE_PASSWORD: ${{ secrets.HIFIVE_PASSWORD }}
        run: python auto_diary.py
