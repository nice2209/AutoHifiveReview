name: HIFIVE 자동 실습일지

on:
  schedule:
    # 정각은 GitHub Actions 부하로 지연될 수 있어 평일 오후 6시 17분에 실행
    - cron: "17 18 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      clear_holidays:
        description: "기존 공휴일 일지를 명시적으로 정리"
        required: false
        type: boolean
        default: false

jobs:
  write-diary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실습일지 자동 작성
        env:
          HIFIVE_USER_ID: ${{ secrets.HIFIVE_USER_ID }}
          HIFIVE_PASSWORD: ${{ secrets.HIFIVE_PASSWORD }}
        run: |
          if [ "${{ inputs.clear_holidays }}" = "true" ]; then
            python auto_diary.py --clear-holidays
          else
            python auto_diary.py
          fi
