name: HIFIVE Web UI 배포

on:
  push:
    branches:
      - master
    paths:
      - 'web-ui/**'
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-ui/package-lock.json'

      - name: 의존성 설치
        run: |
          cd web-ui
          npm ci

      - name: React 프로젝트 빌드
        run: |
          cd web-ui
          npm run build

      - name: GitHub Pages에 배포
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-ui/dist
          branch: gh-pages # 배포 대상 브랜치
          clean: true
